<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple English Wikipedia Search Engine</title>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 3rem auto;
            padding: 0 1rem;
            color: #333;
        }
        img {
            margin: auto;
        }
        .search-box {
            width: 100%;
            padding: 0.75rem;
            font-size: 1.1rem;
            border: 2px solid #ccc;
            border-radius: 6px;
            margin-bottom: 2rem;
            box-sizing: border-box;
        }
        .search-box:focus {
            border-color: #007bff;
            outline: none;
        }
        .article-result {
            background: #f9f9f9;
            border: 1px solid #eaeaea;
            border-radius: 6px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        .article-result h3 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: #111;
        }
        .similarity {
            font-size: 0.85rem;
            font-weight: normal;
            color: #28a745;
            margin-left: 0.5rem;
        }
        .article-result p {
            margin: 0;
            line-height: 1.5;
            color: #555;
        }
        .htmx-indicator {
            display: none;
            color: #666;
            margin-bottom: 1rem;
        }
        .htmx-request .htmx-indicator {
            display: block;
        }
        .htmx-request.htmx-indicator {
            display: block;
        }
    </style>
</head>
<body>
    <img src="/gopher.png" alt="Loading...">
    <h1>Simple English Wikipedia Search Engine</h1>

    <input class="search-box" 
           type="search" 
           name="q" 
           placeholder="Search articles..." 
           hx-get="/search" 
           hx-trigger="input changed delay:250ms, search" 
           hx-target="#search-results" 
           hx-indicator=".htmx-indicator">

    <div class="htmx-indicator">Searching...</div>

    <div id="search-results"></div>

</body>
</html>
